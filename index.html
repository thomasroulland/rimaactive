         ajouter og:image et og:url avec l'adresse complète dès que le nom de domaine est acheté. -->

    <title>Rimaactive · Accueil</title>
    <script>
      // Mise à l'échelle (13 novembre 2026) : jusqu'à l'écran de Marie (1536 × 720 à 100 %), les tailles de la charte ;
      // au-delà, tout grandit en proportion pour remplir les grands écrans : 1,5 fois au plus, 2 fois sur les très grands (3000 px et plus, 4K à 100 %).
      // La même règle partout : site, connexion, espace coaché et espace coach.
      // Le zoom du navigateur (Ctrl + / Ctrl −) reste libre : il s'ajoute par-dessus.
      ;(function () {
        var racine = document.documentElement
        var REF_L = 1536, REF_H = 720
        function zoomNavigateur() {
          // la fenêtre (outerWidth) ne change pas quand on zoome, la page (innerWidth) si : leur rapport donne le zoom
          if (!window.outerWidth || !window.innerWidth) return 1
          var z = Math.round((window.outerWidth / window.innerWidth) * 20) / 20
          return z > 0.2 && z < 5 ? z : 1
        }
        function ajuster() {
          var z = zoomNavigateur()
          // taille qu'aurait la fenêtre à 100 % : c'est elle qui décide de l'agrandissement
          var MAX = window.innerWidth * z >= 3000 ? 2 : 1.5
          var echelle = Math.max(1, Math.min(MAX, (window.innerWidth * z) / REF_L, (window.innerHeight * z) / REF_H))
          echelle = Math.round(echelle * 100) / 100
          racine.style.zoom = echelle
          // le zoom agrandit aussi la hauteur et la largeur d'écran : on les ramène aux vraies dimensions visibles
          racine.style.setProperty('--ecran', 'calc(100svh / ' + echelle + ')')
          racine.style.setProperty('--vw', window.innerWidth / echelle / 100 + 'px')
        }
        // gardé pour l'espace, qui l'appelle encore : la règle est la même partout, il n'a plus rien à faire
        window.__rimaZoom = function () {}
        ajuster()
        window.addEventListener('resize', ajuster)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
